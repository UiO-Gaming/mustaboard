name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never run two deploys of this repo at the same time
concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Set up SSH
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ vars.SSH_HOST }} > ~/.ssh/known_hosts

      # The deploy key can only run /usr/local/bin/uiogaming-deploy on the server. It takes the
      # service name from the top-level docker-compose.yml (see drift/driftsdokumentasjon.md).
      - name: Deploy
        run: ssh ${{ secrets.SSH_USER }}@${{ vars.SSH_HOST }} mustaboard

      - name: Clean up
        if: always()
        run: rm -rf ~/.ssh
